[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scout-music"
version = "1.0.0"
description = "Universal Music Discovery & Archiving Engine with Playlist DNA, Subsonic, and MPRIS integration"
readme = "README.md"
authors = [
    { name = "Berk", email = "berk@berkos.local" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = ["music", "discovery", "downloader", "subsonic", "navidrome", "mpris", "spotify", "ytmusic", "lastfm", "textual", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "yt-dlp>=2024.8.0",
    "ytmusicapi>=1.12.0",
    "mutagen>=1.47.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "textual>=0.70.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
scout = "scout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scout"]
